apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-static-app
  namespace: sample-static-app
  labels:
    app: sample-static-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-static-app
  template:
    metadata:
      labels:
        app: sample-static-app
    spec:
      containers:
        - name: sample-static-app
          # Replace with your image registry/repo, e.g.:
          # <account-id>.dkr.ecr.<region>.amazonaws.com/sample-static-app:latest
          image: 930501832757.dkr.ecr.ap-south-1.amazonaws.com/sample-deploy-eks-argo:3
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
